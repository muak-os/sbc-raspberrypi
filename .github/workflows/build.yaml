name: Build

on:
  push:
    tags: ["v[0-9]+.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      board:
        description: Board overlay to build (all boards on tags)
        type: choice
        options:
          - rpi_generic
          - rpi_5
        default: rpi_generic
      latest:
        description: Tag the image as latest
        type: boolean
        default: true
      tag:
        description: Tag to build (defaults to current commit)
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/muak-os
  CONTAINER_RUNTIME: docker

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        board: [rpi_generic, rpi_5]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tag --always --dirty --match v[0-9]* 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build shared images (no push)
        if: github.event_name == 'pull_request' && matrix.board == 'rpi_generic'
        run: just shared

      - name: Build and push overlay
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.board == matrix.board)
        run: just build
        env:
          CONTAINER_RUNTIME: docker
          BOARD: ${{ matrix.board }}
          PUSH: "true"
          LATEST: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.latest) }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Build summary
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.board == matrix.board)
        env:
          BOARD: ${{ matrix.board }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="${{ env.REGISTRY }}/sbc-raspberrypi"
          if [[ "${BOARD}" != "rpi_generic" ]]; then
            IMAGE="${IMAGE}-${BOARD}"
          fi
          echo "### ${BOARD} Built" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Tag:** \`${TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- **Image:** \`${IMAGE}:${TAG}\`" >> "${GITHUB_STEP_SUMMARY}"